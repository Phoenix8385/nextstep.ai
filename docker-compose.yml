services:
  postgres:
    image: postgres:16-alpine
    container_name: nextstep-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: nextstep
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: nextstep
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextstep -d nextstep"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nextstep-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: nextstep-api
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    env_file:
      - services/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://nextstep:localdevpassword@postgres:5432/nextstep
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
