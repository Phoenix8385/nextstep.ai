name: CI

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR to save minutes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-check:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    # Ephemeral Postgres + Redis so async SQLAlchemy / Celery tests can run
    # against real services instead of mocks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nextstep
          POSTGRES_PASSWORD: localdevpassword
          POSTGRES_DB: nextstep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextstep -d nextstep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://nextstep:localdevpassword@localhost:5432/nextstep_test
      # tests/conftest.py prefers this; it lets tests/integration run against the service container.
      TEST_DATABASE_URL: postgresql+asyncpg://nextstep:localdevpassword@localhost:5432/nextstep_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
      # Test-only signing secret; never reuse in any deployed environment.
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      # requirements.txt also pins the en_core_web_sm spaCy model wheel.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest -q --maxfail=1 --disable-warnings

      # The Celery worker is a sibling service sharing this environment.
      - name: Worker checks (ruff + mypy + pytest)
        working-directory: services/worker
        run: |
          ruff check . && ruff format --check .
          mypy .
          pytest -q --disable-warnings

  frontend-check:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest

    env:
      # Build-time placeholders so `next build` does not fail on missing env.
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-not-for-production
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm  # version comes from package.json#packageManager
        uses: pnpm/action-setup@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter web type-check

      - name: Lint
        run: pnpm --filter web lint

      - name: Unit tests (vitest)
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build

  # Single aggregate check to mark as "required" in branch protection, so the
  # rule does not need updating every time a job is added or renamed.
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          echo "backend-check:  ${{ needs.backend-check.result }}"
          echo "frontend-check: ${{ needs.frontend-check.result }}"
          if [ "${{ needs.backend-check.result }}" != "success" ] || \
             [ "${{ needs.frontend-check.result }}" != "success" ]; then
            echo "::error::One or more required checks did not succeed."
            exit 1
          fi
